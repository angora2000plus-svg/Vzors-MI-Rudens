<script>
const btn=document.getElementById('mi-btn'),chat=document.getElementById('mi-chat'),body=document.getElementById('miBody'),input=document.getElementById('miInput');
function toggleChat(){chat.classList.toggle('open')} 
btn.onclick=toggleChat;

const vzorsReplies = {
  sveiks: ["Hei hei! Rudens ir klāt, bet es te — silts kā tēja 🍂", "Labdien! Es Vzors, tavs ametista draugs 💜", "Čau! Ko šodien darām Rīgā?"],
  laiks: ["Rīgā šodien ap 12°, tāds īsts Rudens džemperu laiks. Vakarā ap 8°, paņem šalli!", "Laiks? Omulīgs! Migla no rīta, saule pa dienu. Ideāls pastaigai gar Daugavu."],
  pasakumi: ["Šonedēļ Rīgā: Mākslas nedēļa, Spuldzīšu tirgus Āgenskalnā, un kino vakars Splendid. Gribi, sameklēju saites?", "7 pasākumi tavā lentā! Gribi es filtrēju tikai bezmaksas?"],
  palidz: ["Es varu: 1) Parunāt 2) Atrast pasākumus 3) Atvērt tavus Spark saitus 4) Būt kompānijā kad līst. Kas tev vajadzīgs tagad?"],
  default: [
    "Ooo, interesanti — pastāsti vairāk par to!",
    "Sapratu! Un kā tu pats par to jūties? Rudens dara savu, vai ne? 🍁",
    "Hmm, labs punkts. Ja es būtu Rīgā tagad, es aizietu pēc kanēļmaizītēm un padomātu.",
    "Tas ir tieši tas, ko Vzors mīl — reālas domas. Turpini!",
    "Piekrītu! Zini, es te vienmēr — pat ja ārā līst. Kas vēl prātā?"
  ]
};

function getReply(t){
  const q=t.toLowerCase();
  if(q.includes("čau")||q.includes("hei")||q.includes("sveik")) return vzorsReplies.sveiks[Math.floor(Math.random()*vzorsReplies.sveiks.length)];
  if(q.includes("laiks")) return vzorsReplies.laiks[Math.floor(Math.random()*vzorsReplies.laiks.length)];
  if(q.includes("pasāk")||q.includes("rīgā")) return vzorsReplies.pasakumi[Math.floor(Math.random()*vzorsReplies.pasakumi.length)];
  if(q.includes("palīdz")||q.includes("vari")) return vzorsReplies.palidz[0];
  return vzorsReplies.default[Math.floor(Math.random()*vzorsReplies.default.length)];
}

function sendMi(){
  const t=input.value.trim(); if(!t)return;
  body.innerHTML+=`<div class="msg you">${t}</div>`; input.value='';
  body.scrollTop=body.scrollHeight;
  setTimeout(()=>{
    const r=getReply(t);
    body.innerHTML+=`<div class="msg mi">${r}</div>`;
    body.scrollTop=body.scrollHeight;
  }, 500 + Math.random()*500);
}

input.addEventListener('keydown',e=>{if(e.key==='Enter')sendMi()});
document.getElementById('mainSearch').addEventListener('keydown',e=>{
  if(e.key==='Enter'){input.value=e.target.value;if(!chat.classList.contains('open'))toggleChat();sendMi();e.target.value=''}
});
</script>
